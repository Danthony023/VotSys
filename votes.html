    <script>
      function activeChange(code) {
        sessionStorage.setItem("activeCode", code);
      }

      (function () {
        var code = sessionStorage.getItem("activeCode");
        console.log(code);
        if (code == 2) {
          document.getElementById("active2").className = "active";
        }
      })();

      //var url = "http://localhost:8080";
      //var wordpressUrl = "http://localhost:8099";
      var url = "https://votingsystemservice.herokuapp.com";
      var positionData = [];
      var filterPosition = [];
      var jsonData = [];
      var selectedLead = {};
      var current_page = 1;
      var records_per_page = 20;

      //ON-READY FUNCTION
      (function () {
        // if (sessionStorage.getItem("lg") != 1) {
        //   location.href = "login.html";
        // }
        $.ajax({
          type: "GET",
          beforeSend: function (request) {
            request.setRequestHeader(
              "Access-Control-Allow-Headers",
              "X-Requested-With, content-type"
            );
            request.setRequestHeader("Access-Control-Allow-Origin", "*");
          },
          url: url + "/timeconfiguration/gets",
          contentType: "application/json",
          dataType: "json",
          success: function (result) {
            console.log(result);
            var curDate = new Date();
            if (curDate > result[0].startTime && curDate < result[0].endTime) {
              //ON-READY FUNCTION
              (function () {
                // if (sessionStorage.getItem("lg") != 1) {
                //   location.href = "login.html";
                // }
                $.ajax({
                  type: "GET",
                  beforeSend: function (request) {
                    request.setRequestHeader(
                      "Access-Control-Allow-Headers",
                      "X-Requested-With, content-type"
                    );
                  },
                  url: url + "/position/gets",
                  contentType: "application/json",
                  dataType: "json",
                  success: function (resultp) {
                    filterPosition = resultp;
                    console.log(resultp);
                    let positionDropdown =
                      document.getElementById("positionDrop");
                    var pp = 0;
                    while (pp < resultp.length) {
                      let selectOption = document.createElement("option");
                      selectOption.text = resultp[pp].name;
                      selectOption.value = resultp[pp].id;
                      positionDropdown.appendChild(selectOption);
                      pp++;
                    }
                  },
                  error: function (resultp) {
                    console.log("Err" + resultp.status);
                  },
                });

                $(".hamburger").click(function () {
                  $(".wrapper").toggleClass("active");
                });
              })();
            } else {
              swal({
                title: "NO CURRENT ELECTION",
                text: "There is no current election for you to vote for",
                icon: "warning",
              }).then(() => {
                location.href = "voters-dashboard.html";
              });
            }
          },
          error: function (result) {
            console.log("Err" + result.status);
          },
        });

        $(".hamburger").click(function () {
          $(".wrapper").toggleClass("active");
        });
      })();

      function voteAspirant(value) {
        var aspirantsIDs = value;
        var positionIDs = document.getElementById("positionDrop").value;
        // var userData = sessionStorage.getItem("user");
        // var usersIDs = userData.personalID;
        console.log(aspirantsIDs);
        $.ajax({
          type: "POST",
          beforeSend: function (request) {
            request.setRequestHeader(
              "Access-Control-Allow-Headers",
              "X-Requested-With, content-type"
            );
          },
          url: url + "/votes/add",
          contentType: "application/json",
          dataType: "json",
          data: JSON.stringify({
            voterID: "626599ac792e4b0de6ba0cf5",
            positionID: positionIDs,
            aspirantID: aspirantsIDs,
          }),
          success: function (result) {
            swal({
              title: result["status"],
              text: result["message"],
              icon: "success",
            }).then(() => {
              location.reload();
            });
          },
          error: function (result) {
            var json = $.parseJSON(result.responseText);
            swal({
              title: json.status,
              text: json.message,
              icon: "error",
            });
          },
        });
      }

      function fetchAspirants(value) {
        var positionID = document.getElementById("positionDrop").value;
        console.log(positionID);
        let typexx = "";
        // Avoid filter for empty string
        if (!value) {
          typexx = "";
        } else {
          const filteredItems = filterPosition.filter(
            (item) => item.id === value
          );

          typexx = filteredItems[0].type;
        }
        console.log(sessionStorage.getItem("user"));
        if (typexx == 0) {
          $.ajax({
            type: "GET",
            beforeSend: function (request) {
              request.setRequestHeader(
                "Access-Control-Allow-Headers",
                "X-Requested-With, content-type"
              );
            },
            url: url + `/aspirants/getByPosition/${positionID}`,
            contentType: "application/json",
            dataType: "json",
            success: function (apiResult) {
              console.log(apiResult);
              const container = document.getElementById("accordion");

              var cd = 0;
              while (cd < apiResult.length) {
                // Create card element
                const card = document.createElement("div");
                card.classList = "card-body";

                // Construct card content
                const content = `
                            <div class="col-lg-4">
                <div class="card" style="width: 18rem; height: 30rem; margin-top: 10%; margin-bottom: 10%;">
                            <img
                              class="card-img-top"
                              src="assets/images/VotSys_blue.png"
                              alt="Card image cap"
                            />
                            <div class="card-body">
                              <h6 class="card-title">${
                                apiResult[cd].fname + " "
                              } ${apiResult[cd].lname + " "} ${
                  apiResult[cd].oname
                }</h6>
                              <p class="card-text">
                                ${apiResult[cd].residentialState}
                              </p>
                              <h6 class="card-text">
                                ${apiResult[cd].sex}
                              </h6>
                              <div class="col-lg-8 mt-3 float-end">
                                <div class="mb-5">
                      <span
                        type="button"
                        class="btn-lg btn-pry"
                        onclick="voteAspirant('${apiResult[cd].id}');"
                        >Vote</span
                      >
                    </div>
                            </div>
                          </div>
                        </div>
          `;

                // Append newyly created card element to the container
                container.innerHTML += content;
                cd++;
              }
            },
            error: function (result) {
              console.log("Err" + result.status);
            },
          });
        } else if (typexx == 1) {
          var userData = sessionStorage.getItem("user");
          var UsersState = userData.residentialState;
          $.ajax({
            type: "GET",
            beforeSend: function (request) {
              request.setRequestHeader(
                "Access-Control-Allow-Headers",
                "X-Requested-With, content-type"
              );
            },
            url:
              url +
              `/aspirants/getByPositionAndState/${positionID}/${UsersState}`,
            contentType: "application/json",
            dataType: "json",
            success: function (apiResult) {
              console.log(apiResult);
              const container = document.getElementById("accordion");

              var cd = 0;
              while (cd < apiResult.length) {
                // Create card element
                const card = document.createElement("div");
                card.classList = "card-body";

                // Construct card content
                const content = `
                            <div class="col-lg-4">
                <div class="card" style="width: 18rem; height: 25rem; margin-top: 10%; margin-bottom: 10%;">
                            <img
                              class="card-img-top"
                              src="assets/images/VotSys_blue.png"
                              alt="Card image cap"
                            />
                            <div class="card-body">
                              <h5 class="card-title">${apiResult[cd].title}</h5>
                              <p class="card-text">
                                ${apiResult[cd].description}
                              </p>
                              <div class="col-lg-8 mt-3 float-end">
                                <div class="mb-5">
                      <span
                        type="button"
                        class="btn-lg btn-pry"
                        onclick="voteAspirant(${apiResult[cd].id});"
                        >Vote</span
                      >
                    </div>
                            </div>
                          </div>
                        </div>
          `;

                // Append newyly created card element to the container
                container.innerHTML += content;
                cd++;
              }
            },
            error: function (result) {
              console.log("Err" + result.status);
            },
          });
        }
      }

      //On-Change Invite Type
      function selectType() {
        var e = document.getElementById("type");
        var type = e.value;
        if (type == "1") {
          document.getElementById("tCandidate").style.display = "block";
          document.getElementById("tAdmin").style.display = "none";
        } else {
          document.getElementById("tCandidate").style.display = "none";
          document.getElementById("tAdmin").style.display = "block";
        }
      }

      function addPosition() {
        var payMethod = "";
        //Calling the API -
        $.ajax({
          type: "POST",
          beforeSend: function (request) {
            request.setRequestHeader(
              "Access-Control-Allow-Headers",
              "X-Requested-With, content-type"
            );
          },
          url: url + "/position/add",
          contentType: "application/json",
          dataType: "json",
          data: JSON.stringify({
            name: document.getElementById("pname").value,
            descrip: document.getElementById("pdescription").value,
          }),
          success: function (result) {
            swal({
              title: result["status"],
              text: result["message"],
              icon: "success",
            }).then(() => {
              location.reload();
            });
          },
          error: function (result) {
            var json = $.parseJSON(result.responseText);
            swal({
              title: json.status,
              text: json.message,
              icon: "error",
            });
          },
        });
      }

      //Function to search table
      function search() {
        var input = document.getElementById("q");
        var filter = input.value.toUpperCase();
        jsonData = [];
        for (var i = 0; i < positionData.length; i++) {
          var prog = positionData[i].program;
          if (prog == null) {
            prog = "";
          }
          if (
            positionData[i].displayName.toUpperCase().indexOf(filter) > -1 ||
            positionData[i].email.toUpperCase().indexOf(filter) > -1 ||
            prog.toUpperCase().indexOf(filter) > -1 ||
            positionData[i].enrollmentStatus.toUpperCase().indexOf(filter) > -1
          ) {
            jsonData.push(positionData[i]);
          }
        }
      }
    </script>
