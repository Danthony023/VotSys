<html>

  <body class="form-v2">
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-4">
          <div class="login-bg text-white">
            <div class="pt-lg-5">
              <p class=""></p>
            </div>
          </div>
        </div>
        <div class="col-md-8">
          <form class="form-detail" action="#" method="post" id="myform">
            <div class="registration-form p-5">
            <h1>Voters Registration Form</h1>
            <h3>Personal</h3>
            <div class="mb-4 row pr-5">
              <div class="col-lg-6">
                <label for="fnamex" class="form-label">First Name:</label>
                <input
                  type="text"
                  name="first_name"
                  id="fnamex"
                  class="form-control"
                />
              </div>
              <div cl
              ass="col-lg-6">
                <label for="lnamex" class="form-label">Last Name:</label>
                <input
                  type="text"
                  name="last_name"
                  id="lnamex"
                  class="form-control"
                />
              </div>
            </div>
            <div class="mb-4 row pr-5">
              <div class="col-lg-6">
                <label for="onamex" class="form-label">Other Name:</label>
                <input
                  type="text"
                  name="other_name"
                  id="onamex"
                  class="form-control"
                />
              </div>
            </div>
            <div class="mb-4 row pr-5">
              <div class="col-lg-6">
                <label for="emailx" class="form-label">Email:</label>
                <input
                  type="text"
                  name="email"
                  id="emailx"
                  class="form-control"
                  required
                  pattern="[^@]+@[^@]+.[a-zA-Z]{2,6}"
                />
              </div>
              <div class="col-lg-6">
                <label for="street" class="form-label">Date Of Birth:</label>
                <input
                  type="date"
                  name="DateOfBirth"
                  id="DoB"
                  class="form-control"
                />
              </div>
            </div>
            <div class="mb-4 row pr-5">
              <div class="col-lg-6">
                <label for="street" class="form-label"
                  >Residential Street:</label
                >
                <input
                  type="text"
                  name="residential-street"
                  id="street"
                  class="form-control"
                />
              </div>
              <div class="col-lg-6">
                <label for="city" class="form-label">Residential city:</label>
                <input
                  type="text"
                  name="residential-city"
                  id="city"
                  class="form-control"
                />
              </div>
            </div>
            <div class="mb-4 row pr-5">
              <div class="col-lg-6">
                <label for="countryx" class="form-label"
                  >Residential Country:</label
                >
                <select
                  class="form-control"
                  style="width: 92%"
                  name="country"
                  id="countryx"
                  disabled
                >
                  <option value="Nigeria">Nigeria</option>
                </select>
              </div>
              <div class="col-lg-6">
                <label for="nstates" class="form-label"
                  >Residential State:</label
                >
                <select
                  class="form-control"
                  style="width: 92%"
                  name="states"
                  id="nstates"
                >
                  <option value="" selected>-Select State-</option>
                </select>
              </div>
            </div>
            <div class="mb-4 row pr-5">
              <div class="col-lg-6">
                <label for="pnox" class="form-label">Phone Number:</label>
                <input
                  type="text"
                  name="phone_number"
                  id="pnox"
                  class="form-control"
                />
              </div>
              <div class="col-lg-6">
                <label for="pnox" class="form-label">Gender:</label>
                <select
                  class="form-control"
                  style="width: 92%"
                  name="gender"
                  id="genderx"
                >
                  <option selected>--Select Gender--</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                </select>
              </div>
            </div>
            <div class="mb-4 row pr-5">
              <div class="col-lg-6">
                <label for="pvcx" class="form-label">PVC:</label>
                <input type="text" name="pvc" id="pvcx" class="form-control" />
              </div>
              <div class="col-lg-6">
                <label for="ninx" class="form-label">NIN:</label>
                <input type="text" name="nin" id="ninx" class="form-control" />
              </div>
            </div>
           
            <h3>Password</h3>
            <div class="mb-4 row pr-5">
              <div class="col-lg-6">
                <label for="passwordx" class="form-label">Password:</label>
                <input
                  type="password"
                  name="password"
                  id="passwordx"
                  class="form-control"
                  required
                />
              </div>
              <div class="col-lg-6">
                <label for="conPasswordx" class="form-label"
                  >Confirm Password:</label
                >
                <input
                  type="password"
                  name="confirm_password"
                  id="conPasswordx"
                  class="form-control"
                  required
                />
              </div>
            </div>
            <div class="mb-4 row pr-5">
              <div class="col-lg-6">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" onclick="togglePassword()" >
                  <label class="form-check-label" name="showPass" id="showPassword">Show Password</label>
                </div>
          </div>
        </div>
            <div class="mb-2">
              <span
                type="button"
                class="btn-lg btn-pry"
                onclick="validate(event);"
                >Create Account</span
              >
            </div>
            <div class="mb-5">
             Already have an account?...<a href="index.html" class=" forgot-password" style="text-decoration: underline">Login</a>
          </div>
          </form>
        </div></div></div>
      </div>
    </div>
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script
      src="https://code.jquery.com/jquery-3.5.1.min.js"
      integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0="
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
      integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
      crossorigin="anonymous"
    ></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/js/bootstrap.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/jquery.validation/1.16.0/jquery.validate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/jquery.validation/1.16.0/additional-methods.min.js"></script>
    <script src="states.js"></script>

    <script>
      // just for the demos, avoids form submit
      jQuery.validator.setDefaults({
        debug: true,
        success: function (label) {
          label.attr("id", "valid");
        },
      });
      $("#myform").validate({
        rules: {
          password: "required",
          conPasswordx: {
            equalTo: "#password",
          },
        },
        messages: {
          fname: {
            required: "Please provide an username",
          },
          lname: {
            required: "Please provide an username",
          },
          oname: {
            required: "Please provide an username",
          },
          emailx: {
            required: "Please provide an email",
          },
          passwordx: {
            required: "Please provide a password",
          },
          conPasswordx: {
            required: "Please provide a password",
          },
        },
      });

      function togglePassword() {
  var pass1 = document.getElementById("passwordx");
  var pass2 = document.getElementById("conPasswordx");
  if (pass1.type === "password" && pass2.type === "password") {
    document.getElementById("showPassword").innerHTML = "Hide Password";
    pass1.type = "text";
    pass2.type = "text";
  } else {
    document.getElementById("showPassword").innerHTML = "Show Password";
    pass1.type = "password";
    pass2.type = "password";
  }
}

      let stateDropdown = document.getElementById("nstates");
      var x = 0;
      while (x < states.length) {
        let stateOption = document.createElement("option");
        stateOption.text = states[x].name;
        stateOption.value = states[x].name;
        stateDropdown.appendChild(stateOption);
        x++;
      }

      var valluuee = document.getElementById("DoB").value;
      console.log(valluuee);

      var url = "https://votingsystemservice.herokuapp.com";

      function validate(event) {
        var bbbbbb = document.getElementById("DoB").value;
        console.log(bbbbbb);
        const dayyss = new Date(bbbbbb);
        console.log(dayyss);
        let dayx = "";
        let monthx = "";
        let yearx = "";
        if (bbbbbb != null) {
          dayx = dayyss.getDate();
          monthx = dayyss.getMonth() + 1;
          yearx = dayyss.getFullYear();
        }
        console.log(dayx);
        console.log(monthx);
        console.log(yearx);
        //Calling the API -
            $.ajax({
              type: "POST",
              beforeSend: function (request) {
                request.setRequestHeader(
                  "Access-Control-Allow-Headers",
                  "X-Requested-With, content-type"
                );
              },
              url: url + "/voters/add",
              contentType: "application/json",
              dataType: "json",
              data: JSON.stringify({
                fname: document.getElementById("fnamex").value,
                lname: document.getElementById("lnamex").value,
                oname: document.getElementById("onamex").value,
                email: document.getElementById("emailx").value,
                dayOfBirth: dayx,
                monthOfBirth: monthx,
                yearOfBirth: yearx,
                residentialStreet: document.getElementById("street").value,
                residentialCity: document.getElementById("city").value,
                residentialCountry: document.getElementById("countryx").value,
                residentialState: document.getElementById("nstates").value,
                pno: document.getElementById("pnox").value,
                sex: document.getElementById("genderx").value,
                pvc: document.getElementById("pvcx").value,
                nin: document.getElementById("ninx").value,
                password: document.getElementById("passwordx").value,
              }),
              success: function (result) {
                //console.log("Here "+result);
                sessionStorage.setItem("user", JSON.stringify(result["user"]));
                sessionStorage.setItem("lg", 1);
                sessionStorage.setItem("url", url);
                swal({
              title: resultlg["status"],
              text: resultlg["message"],
              icon: "success",
            }).then(() => {
              location.href = "voters-dashboard.html";
            });
              },
              error: function (result) {
                var json = $.parseJSON(result.responseText);
                swal({
                  title: json.status,
                  text: json.message,
                  icon: "error",
                });
              },
            });
      }
    </script>
  </body>
