<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VotSys</title>
    <!-- Mobile Specific Metas -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      rel="apple-touch-icon"
      sizes="96x96"
      href="assets/images/VotSys_blue.png"
    />
    <link rel="icon" type="image/png" href="assets/images/VotSys_blue.png" />
    <!--    font-awesome-->
    <link
      href="https://use.fontawesome.com/releases/v5.0.6/css/all.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="assets/css/bootstrap.css" />
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />

    <link rel="stylesheet" href="assets/css/main.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,300;1,600;1,800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="form-v2">
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-4">
          <div class="login-bg text-white">
            <div class="pt-lg-5">
              <p class=""></p>
            </div>
          </div>
        </div>
        <div class="col-md-8">
          <div class="login-form p-5">
            <h1>Aspirants Login</h1>
            <form class="pt-5">
                <div class="mb-5">
                    <label for="usernamex" class="form-label" style="font-size: 16px;font-weight: 500">NIN OR PVC</label>
                    <input type="email" class="form-control" id="usernamex" placeholder="NIN OR PVC" onkeyup="pressKey(event);" style="width: 70%">
                </div>
                <div class="mb-5">
                    <label for="passwordx" class="form-label" style="font-size: 16px;font-weight: 500">Password</label>
                    <input type="password" class="form-control" id="passwordx" placeholder="password" onkeyup="pressKey(event);"  style="width: 70%">
                </div>
                <div class="mb-4 row pr-5">
                    <div class="col-lg-6">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" onclick="togglePassword()" >
                        <label class="form-check-label" name="showPass" id="showPassword">Show Password</label>
                      </div>
                </div>
              </div>
                <div class="mb-2">
                    <button type="button" class="btn  pry-btn" onclick="validate(event);">Login</button>
                    <a href="#" class="pl-5 pt-2 forgot-password float-end">Forgot Password?</a>
                </div>
                <div class="mb-5">
                    Don't have an account?...<a href="aspirants-registration.html" class=" forgot-password" style="text-decoration: underline">Create Account</a>
                 </div>
            </form>
        </div>
        </div></div></div>
      </div>
    </div>
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script
      src="https://code.jquery.com/jquery-3.5.1.min.js"
      integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0="
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
      integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
      crossorigin="anonymous"
    ></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/js/bootstrap.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/jquery.validation/1.16.0/jquery.validate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/jquery.validation/1.16.0/additional-methods.min.js"></script>

    <script>
      // just for the demos, avoids form submit
      jQuery.validator.setDefaults({
        debug: true,
        success: function (label) {
          label.attr("id", "valid");
        },
      });
      $("#myform").validate({
        rules: {
          usernamex: "required",
          passwordx: "required",
        },
        messages: {
          usernamex: {
            required: "Please provide an username",
          },
          passwordx: {
            required: "Please provide a password",
          },
        },
      });
      var url = "https://votingsystemservice.herokuapp.com";

      function pressKey(e){
            if (e.keyCode == 13) {
                validate(event);
            }
        }

        function togglePassword() {
  var pass1 = document.getElementById("passwordx");
  if (pass1.type === "password") {
    document.getElementById("showPassword").innerHTML = "Hide Password";
    pass1.type = "text";
  } else {
    document.getElementById("showPassword").innerHTML = "Show Password";
    pass1.type = "password";
  }
}


      function validate(event) {
       
        //Calling the API -
        $.ajax({
          type: "POST",
          beforeSend: function (request) {
            request.setRequestHeader(
              "Access-Control-Allow-Headers",
              "X-Requested-With, content-type"
            );
          },
          url: url + "/aspirants/doLogin",
          contentType: "application/json",
          dataType: "json",
          data: JSON.stringify({
                username : document.getElementById("usernamex").value,
                password : document.getElementById("passwordx").value
            }),
          success: function (result) {
           //console.log("Here "+result);
           sessionStorage.setItem("user", JSON.stringify(result["user"]));
                sessionStorage.setItem("lg", 1);
                sessionStorage.setItem("url", url);
                console.log( sessionStorage.getItem("user"));
                swal({
              title: result["status"],
              text: result["message"],
              icon: "success",
            }).then(() => {
              location.href = "aspirants-dashboard.html";
            });
          },
          error: function (result) {
            var json = $.parseJSON(result.responseText);
            swal({
              title: json.status,
              text: json.message,
              icon: "error",
            });
          },
        });
      }
    </script>
  </body>
  <!-- This templates was made by Colorlib (https://colorlib.com) -->
</html>
