<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VotSys — Secure Online Voting Portal</title>

    <link rel="apple-touch-icon" sizes="96x96" href="assets/images/VotSys_blue.png" />
    <link rel="icon" type="image/png" href="assets/images/VotSys_blue.png" />

    <!-- Font Awesome & Google Fonts -->
    <link href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,300;1,600;1,800&display=swap" rel="stylesheet" />

    <!-- Bootstrap CSS & Main CSS -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/main.css" />

    <style>
      /* FIX: Override main.css fixed position on .login-bg so it doesn't cover and block mouse clicks */
      .login-bg {
        position: relative !important;
        width: 100% !important;
        height: 100vh !important;
        background-size: cover !important;
        pointer-events: none !important;
        right: auto !important;
      }

      .login-form-column {
        position: relative !important;
        z-index: 10 !important;
      }

      .role-switcher {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
      }
      .role-tab-btn {
        border: 2px solid #23bd49;
        background: #fff;
        color: #23bd49;
        padding: 8px 18px;
        border-radius: 20px;
        font-weight: 500;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
      }
      .role-tab-btn.active, .role-tab-btn:hover {
        background: #23bd49;
        color: #fff;
      }
      .login-form-wrapper {
        max-width: 600px;
      }
      .pry-btn {
        cursor: pointer !important;
      }
    </style>
  </head>
  <body class="form-v2">
    <div class="container-fluid">
      <div class="row min-vh-100">
        <!-- Sidebar Image Container -->
        <div class="col-md-4 p-0">
          <div class="login-bg text-white">
            <div class="pt-lg-5">
              <p></p>
            </div>
          </div>
        </div>

        <!-- Form Container -->
        <div class="col-md-8 login-form-column d-flex align-items-center">
          <div class="login-form p-4 p-md-5 login-form-wrapper w-100">
            <h1 class="mb-3" id="portalTitle">Voters Login</h1>

            <!-- Role Tabs -->
            <div class="role-switcher">
              <button type="button" class="role-tab-btn active" id="btn-voter" onclick="selectRole('voter')">
                <i class="fas fa-user-check mr-1"></i> Voter
              </button>
              <button type="button" class="role-tab-btn" id="btn-aspirant" onclick="selectRole('aspirant')">
                <i class="fas fa-user-tie mr-1"></i> Aspirant
              </button>
              <button type="button" class="role-tab-btn" id="btn-admin" onclick="selectRole('admin')">
                <i class="fas fa-user-shield mr-1"></i> Admin
              </button>
            </div>

            <!-- Login Form -->
            <form class="pt-2" id="loginForm" onsubmit="validate(event)">
              <input type="hidden" id="currentRole" value="voter" />

              <div class="mb-4">
                <label for="usernamex" class="form-label" style="font-size: 16px; font-weight: 500;" id="userLabel">NIN OR PVC</label>
                <input type="text" class="form-control" id="usernamex" placeholder="NIN OR PVC" onkeyup="pressKey(event);" style="width: 80%" required />
              </div>

              <div class="mb-4">
                <label for="passwordx" class="form-label" style="font-size: 16px; font-weight: 500;">Password</label>
                <input type="password" class="form-control" id="passwordx" placeholder="Password" onkeyup="pressKey(event);" style="width: 80%" required />
              </div>

              <div class="mb-4 row pr-5">
                <div class="col-lg-6">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="passToggle" onclick="togglePassword()" />
                    <label class="form-check-label" for="passToggle" id="showPassword" style="cursor: pointer;">Show Password</label>
                  </div>
                </div>
              </div>

              <div class="mb-3">
                <button type="button" class="btn pry-btn" id="submitBtn" onclick="validate(event);">Login</button>
                <a href="#" class="pl-4 pt-2 forgot-password">Forgot Password?</a>
              </div>

              <div class="mb-5" id="accountPrompt">
                Don't have an account?...<a href="voters-registration.html" id="registerLink" class="forgot-password" style="text-decoration: underline">Create Account</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <!-- VotSys Core Modules -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>

    <script>
      function selectRole(role) {
        document.getElementById("currentRole").value = role;
        
        // Update active tab buttons
        $(".role-tab-btn").removeClass("active");
        $("#btn-" + role).addClass("active");

        const portalTitle = document.getElementById("portalTitle");
        const userLabel = document.getElementById("userLabel");
        const usernamex = document.getElementById("usernamex");
        const accountPrompt = document.getElementById("accountPrompt");
        const registerLink = document.getElementById("registerLink");

        if (role === "voter") {
          portalTitle.innerText = "Voters Login";
          userLabel.innerText = "NIN OR PVC";
          usernamex.placeholder = "NIN OR PVC";
          accountPrompt.style.display = "block";
          registerLink.href = "voters-registration.html";
          registerLink.innerText = "Create Account";
        } else if (role === "aspirant") {
          portalTitle.innerText = "Aspirants Login";
          userLabel.innerText = "NIN OR REGISTRATION ID";
          usernamex.placeholder = "NIN OR Candidate ID";
          accountPrompt.style.display = "block";
          registerLink.href = "aspirants-registration.html";
          registerLink.innerText = "Register as Aspirant";
        } else if (role === "admin") {
          portalTitle.innerText = "Admin Login";
          userLabel.innerText = "ADMIN USERNAME / EMAIL";
          usernamex.placeholder = "Admin Username";
          accountPrompt.style.display = "none";
        }
      }

      function pressKey(e) {
        if (e.keyCode == 13) {
          validate(e);
        }
      }

      function togglePassword() {
        var pass1 = document.getElementById("passwordx");
        if (pass1.type === "password") {
          document.getElementById("showPassword").innerHTML = "Hide Password";
          pass1.type = "text";
        } else {
          document.getElementById("showPassword").innerHTML = "Show Password";
          pass1.type = "password";
        }
      }

      function validate(event) {
        if (event) event.preventDefault();

        const role = document.getElementById("currentRole").value;
        const username = document.getElementById("usernamex").value.trim();
        const password = document.getElementById("passwordx").value;
        const submitBtn = document.getElementById("submitBtn");

        if (!username || !password) {
          swal("Required", "Please provide both username and password.", "warning");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "Authenticating...";

        let loginPromise;
        if (role === "aspirant") {
          loginPromise = votsysApi.aspirantLogin(username, password);
        } else if (role === "admin") {
          loginPromise = votsysApi.adminLogin(username, password);
        } else {
          loginPromise = votsysApi.voterLogin(username, password);
        }

        loginPromise
          .then(result => {
            Auth.setUser(result["user"] || { username, role }, role);

            swal({
              title: result["status"] || "Login Successful",
              text: result["message"] || "Welcome to VotSys!",
              icon: "success",
            }).then(() => {
              if (role === "aspirant") {
                location.href = "aspirants-dashboard.html";
              } else if (role === "admin") {
                location.href = "user-management.html";
              } else {
                location.href = "voters-dashboard.html";
              }
            });
          })
          .catch(err => {
            swal({
              title: err.status || "Login Failed",
              text: err.message || "Invalid credentials. Please try again.",
              icon: "error",
            });
          })
          .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Login";
          });
      }

      $(document).ready(function () {
        const urlParams = new URLSearchParams(window.location.search);
        const paramRole = urlParams.get("role");
        if (paramRole && ["voter", "aspirant", "admin"].includes(paramRole)) {
          selectRole(paramRole);
        }
      });
    </script>
  </body>
</html>
