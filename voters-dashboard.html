    <script src="https://cdn.jsdelivr.net/jquery.validation/1.16.0/jquery.validate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/jquery.validation/1.16.0/additional-methods.min.js"></script>

    <script>
      jQuery.validator.setDefaults({
        debug: true,
        success: function (label) {
          label.attr("id", "valid");
        },
      });
      $("#myform").validate({
        rules: {
          password: "required",
          confirm_password: {
            equalTo: "#password",
          },
        },
        messages: {
          pname: {
            required: "Please provide an username",
          },
          pdescription: {
            required: "Please provide an username",
          },
        },
      });
      function activeChange(code) {
        sessionStorage.setItem("activeCode", code);
      }

      (function () {
        var code = sessionStorage.getItem("activeCode");
        console.log(code);
        if (code == 1) {
          document.getElementById("active1").className = "active";
        }
      })();

      //var url = "http://localhost:8080";
      //var wordpressUrl = "http://localhost:8099";
      var url = "https://votingsystemservice.herokuapp.com";
      var positionData = [];
      var jsonData = [];
      var selectedLead = {};
      var current_page = 1;
      var records_per_page = 20;

      //ON-READY FUNCTION
      (function () {
        // if (sessionStorage.getItem("lg") != 1) {
        //   location.href = "login.html";
        // }
        $.ajax({
          type: "GET",
          beforeSend: function (request) {
            request.setRequestHeader(
              "Access-Control-Allow-Headers",
              "X-Requested-With, content-type"
            );
            request.setRequestHeader("Access-Control-Allow-Origin", "*");
          },
          url: url + "/position/gets",
          contentType: "application/json",
          dataType: "json",
          success: function (result) {
            console.log(result);
            positionData = result;
            jsonData = result;

            changePage(1);
          },
          error: function (result) {
            console.log("Err" + result.status);
          },
        });

        $(".hamburger").click(function () {
          $(".wrapper").toggleClass("active");
        });
      })();

      //On-Change Invite Type
      function selectType() {
        var e = document.getElementById("type");
        var type = e.value;
        if (type == "1") {
          document.getElementById("tCandidate").style.display = "block";
          document.getElementById("tAdmin").style.display = "none";
        } else {
          document.getElementById("tCandidate").style.display = "none";
          document.getElementById("tAdmin").style.display = "block";
        }
      }

      function addPosition() {
        var payMethod = "";
        //Calling the API -
        $.ajax({
          type: "POST",
          beforeSend: function (request) {
            request.setRequestHeader(
              "Access-Control-Allow-Headers",
              "X-Requested-With, content-type"
            );
          },
          url: url + "/position/add",
          contentType: "application/json",
          dataType: "json",
          data: JSON.stringify({
            name: document.getElementById("pname").value,
            descrip: document.getElementById("pdescription").value,
          }),
          success: function (result) {
            swal({
              title: result["status"],
              text: result["message"],
              icon: "success",
            }).then(() => {
              location.reload();
            });
          },
          error: function (result) {
            var json = $.parseJSON(result.responseText);
            swal({
              title: json.status,
              text: json.message,
              icon: "error",
            });
          },
        });
      }

      //Function to search table
      function search() {
        var input = document.getElementById("q");
        var filter = input.value.toUpperCase();
        jsonData = [];
        for (var i = 0; i < positionData.length; i++) {
          var prog = positionData[i].program;
          if (prog == null) {
            prog = "";
          }
          if (
            positionData[i].displayName.toUpperCase().indexOf(filter) > -1 ||
            positionData[i].email.toUpperCase().indexOf(filter) > -1 ||
            prog.toUpperCase().indexOf(filter) > -1 ||
            positionData[i].enrollmentStatus.toUpperCase().indexOf(filter) > -1
          ) {
            jsonData.push(positionData[i]);
          }
        }
        changePage(1);
      }

      function prevPage() {
        if (current_page > 1) {
          current_page--;
          changePage(current_page);
        }
      }
      function nextPage() {
        if (current_page < numPages()) {
          current_page++;
          changePage(current_page);
        }
      }
      function changePage(page) {
        var btn_next = document.getElementById("btn_next");
        var btn_prev = document.getElementById("btn_prev");
        var listing_table = document.getElementById("fi");
        var page_span = document.getElementById("page");

        // Validate page
        if (page < 1) page = 1;
        if (page > numPages()) page = numPages();

        listing_table.innerHTML = "";

        listing_table.innerHTML +=
          "<tbody><tr><td><b>Name</b></td><td><b>Description</b></td><td><b>Actions</b></td></tr>";
        var total = page * records_per_page;
        if (jsonData.length < page * records_per_page) {
          total = jsonData.length;
        }
        if (total <= 0) return;
        for (var i = (page - 1) * records_per_page; i < total; i++) {
          var prog = jsonData[i].program;
          if (prog == null) {
            prog = "";
          }
          var enrollmentStatus = jsonData[i].enrollmentStatus;
          //console.log("mexid "+exams[i].id);
          var oneRecord = "";

          oneRecord =
            "<tr><td>" +
            jsonData[i].name +
            "</td><td>" +
            jsonData[i].descrip +
            "</td>" +
            '<td class="options-ham-menu"> <div class="actions dropdown"> \
                                <span class="actions  dropdown-toggle" href="#"  id="action-dropDown2" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" onclick="kclick(\'' +
            i +
            '\');">...</span> \
                                <div class="action dropdown-menu" aria-labelledby="action-dropDown2"><a class="dropdown-item"  data-toggle="modal" data-target="#exampleModal" style="cursor: pointer">Edit </a> \
                                </div></div></td></tr>';

          listing_table.innerHTML += oneRecord;
        }
        listing_table.innerHTML += "</tbody>";
        page_span.innerHTML = page;

        if (page == 1) {
          btn_prev.style.visibility = "hidden";
        } else {
          btn_prev.style.visibility = "visible";
        }

        if (page == numPages()) {
          btn_next.style.visibility = "hidden";
        } else {
          btn_next.style.visibility = "visible";
        }
      }

      function numPages() {
        return Math.ceil(jsonData.length / records_per_page);
      }

      //Function to handle the transition of selected lead
      function kclick(x) {
        //console.log("My "+jsonData[x]);
        var alead = jsonData[x];
        selectedLead = jsonData[x];

        document.getElementById("exampleModalLabel").innerHTML = alead.name;
        document.getElementById("epname").value = alead.name;
        document.getElementById("epdescrip").value = alead.descrip;
      }

      //Lead Update
      function editLead() {
        //Calling the API -
        $.ajax({
          type: "POST",
          beforeSend: function (request) {
            request.setRequestHeader(
              "Access-Control-Allow-Headers",
              "X-Requested-With, content-type"
            );
          },
          url: url + "/position/update",
          contentType: "application/json",
          dataType: "json",
          data: JSON.stringify({
            name: document.getElementById("epname").value,
            descrip: document.getElementById("epdescrip").value,
            id: selectedLead.id,
          }),
          success: function (result) {
            swal({
              title: result["status"],
              text: result["message"],
              icon: "success",
            }).then(() => {
              location.reload();
            });
          },
          error: function (result) {
            var json = $.parseJSON(result.responseText);
            swal({
              title: json.status,
              text: json.message,
              icon: "error",
            });
          },
        });
      }
    </script>
